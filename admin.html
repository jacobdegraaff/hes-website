        }

            color: var(--dark-grey);
            line-height: 1.6;
        }
        
        /* Login Gate */
        #login-gate {
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; background: var(--green-primary);
        }
        .login-card {
            background: white; border-radius: 16px; padding: 3rem;
            width: 400px; text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
        }
        .login-card h1 { font-family: 'Montserrat', sans-serif; color: var(--green-primary); margin-bottom: 0.5rem; }
        .login-card p { color: var(--text-muted); margin-bottom: 1.5rem; font-size: 0.9rem; }
        .login-card input {
            width: 100%; padding: 0.85rem; border: 2px solid var(--border);
            border-radius: 10px; font-size: 1rem; margin-bottom: 0.5rem;
            font-family: inherit;
        }
        .login-card input:focus { outline: none; border-color: var(--green-accent); }
        .login-error { color: #c0392b; font-size: 0.85rem; margin: 0.5rem 0; display: none; }
        .login-error.show { display: block; }
        
        /* Admin Layout */
        #admin-panel { display: none; }
        .admin-header {
            background: var(--green-primary); color: white;
            padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between;
        }
        .admin-header h1 { font-family: 'Montserrat', sans-serif; font-size: 1.2rem; }
        .admin-header .token-status { font-size: 0.8rem; opacity: 0.8; }
        .admin-header button {
            background: transparent; border: 1px solid rgba(255,255,255,0.3);
            color: white; padding: 0.5rem 1rem; border-radius: 8px;
            cursor: pointer; font-size: 0.85rem;
        }
        .admin-header button:hover { background: rgba(255,255,255,0.1); }
        
        .admin-body {
            max-width: 1000px; margin: 0 auto; padding: 2rem;
        }
        
        .toolbar {
            display: flex; gap: 1rem; margin-bottom: 2rem;
            flex-wrap: wrap; align-items: center;
        }
        .toolbar select {
            padding: 0.65rem 1rem; border: 2px solid var(--border);
            border-radius: 10px; font-family: inherit; font-size: 0.9rem;
            background: white; cursor: pointer;
        }
        .toolbar .btn {
            padding: 0.65rem 1.5rem; border-radius: 10px;
            font-family: 'Montserrat', sans-serif; font-weight: 500;
            font-size: 0.9rem; cursor: pointer; border: none;
            transition: all 0.15s;
        }
        .btn-primary { background: var(--green-accent); color: var(--green-primary); }
        .btn-primary:hover { background: #6FAA2E; }
        .btn-secondary { background: white; color: var(--dark-grey); border: 2px solid var(--border); }
        .btn-danger { background: #c0392b; color: white; }
        .btn-success { background: #27ae60; color: white; }
        
        /* Form */
        .seo-section {
            background: white; border-radius: 14px;
            padding: 1.5rem 2rem; margin-bottom: 1.5rem;
            border: 1px solid var(--border);
        }
        .seo-section h3 {
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem; color: var(--green-primary);
            margin-bottom: 1.25rem; padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--border);
        }
        .form-grid {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 1rem 2rem;
        }
        .form-group { margin-bottom: 0.75rem; }
        .form-group.full { grid-column: 1 / -1; }
        .form-group label {
            display: block; font-size: 0.78rem; font-weight: 600;
            color: var(--text-muted); text-transform: uppercase;
            letter-spacing: 0.05em; margin-bottom: 0.3rem;
        }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%; padding: 0.6rem 0.75rem;
            border: 1.5px solid var(--border); border-radius: 8px;
            font-family: inherit; font-size: 0.9rem;
            transition: border-color 0.15s;
        }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            outline: none; border-color: var(--green-accent);
        }
        .form-group textarea { resize: vertical; min-height: 60px; }
        .form-group .char-count {
            font-size: 0.72rem; color: var(--text-muted); text-align: right;
        }
        .form-group .char-count.warn { color: #e67e22; }
        .form-group .char-count.danger { color: #c0392b; }
        
        .toggle-row {
            display: flex; gap: 2rem; align-items: center;
        }
        .toggle-row label { margin-bottom: 0; display: flex; align-items: center; gap: 0.5rem; cursor: pointer; }
        .toggle-row input[type=checkbox] {
            width: auto; accent-color: var(--green-accent);
        }
        
        /* SERP Preview */
        .serp-preview {
            background: white; border: 1px solid #dadce0;
            border-radius: 8px; padding: 1rem; margin-top: 1rem;
            max-width: 600px;
        }
        .serp-preview .serp-title {
            color: #1a0dab; font-size: 1.1rem;
            text-decoration: none; display: block; margin-bottom: 2px;
            font-family: arial, sans-serif;
        }
        .serp-preview .serp-url {
            color: #006621; font-size: 0.82rem; margin-bottom: 2px;
        }
        .serp-preview .serp-desc {
            color: #545454; font-size: 0.85rem; line-height: 1.4;
        }
        
        .toast {
            position: fixed; bottom: 2rem; right: 2rem;
            padding: 1rem 1.5rem; border-radius: 10px;
            color: white; font-weight: 500; z-index: 999;
            animation: slideIn 0.3s ease;
            display: none;
        }
        .toast.success { background: #27ae60; }
        .toast.error { background: #c0392b; }
        @keyframes slideIn { from { transform: translateY(20px); opacity: 0; } }
        
        @media (max-width: 768px) {
            .form-grid { grid-template-columns: 1fr; }
            .login-card { width: 90%; padding: 2rem; }

</head>

// ─── Auth ───
async function sha256(str) {
    const buf = new TextEncoder().encode(str);
    const hash = await crypto.subtle.digest('SHA-256', buf);
    return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
}

async function doLogin() {
    const pw = document.getElementById('login-password').value;
    const hash = await sha256(pw);
    if (hash === PASSWORD_HASH) {
        document.getElementById('login-gate').style.display = 'none';
        document.getElementById('admin-panel').style.display = 'block';
        updateTokenStatus();
        sessionStorage.setItem('hes_seo_authed', '1');
    } else {
        document.getElementById('login-error').classList.add('show');
    }
}

function doLogout() {
    sessionStorage.removeItem('hes_seo_authed');
    location.reload();
}

// ─── Token ───
function setupToken() {
    const token = prompt('GitHub Personal Access Token (repo scope):\n\nMaak er een op: https://github.com/settings/tokens\nKies "repo" scope.', githubToken);
    if (token) {
        githubToken = token;
        localStorage.setItem('hes_seo_github_token', token);
        updateTokenStatus();
        showToast('success', '✅ Token opgeslagen');
    }
}

function updateTokenStatus() {
    const el = document.getElementById('token-status');
    const btn = document.getElementById('btn-token');
    if (githubToken) {
        el.textContent = 'GitHub token: ✅ actief';
        el.style.color = '#7FBF3A';
        btn.textContent = '🔄 Token';
    } else {
        el.textContent = 'GitHub token: ⚠️ niet ingesteld';
        el.style.color = '#ffc107';
        btn.textContent = '⚙️ Token';
    }
}

// ─── Load page ───
async function loadPage() {
    const filename = document.getElementById('page-select').value;
    currentFilename = filename;
    document.getElementById('save-status').textContent = 'Laden...';
    
    try {
        const url = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/${BRANCH}/${filename}`;
        const resp = await fetch(url, { cache: 'no-store' });
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        
        const html = await resp.text();
        currentPageSeo = extractSEO(html);
        
        // Merge with defaults for any missing fields
        if (pageDefaults[filename]) {
            currentPageSeo = { ...pageDefaults[filename], ...currentPageSeo };
        }
        
        renderForm(currentPageSeo);
        updateSERPPreview(currentPageSeo);
        document.getElementById('save-status').textContent = '✅ Geladen';
    } catch (e) {
        // Fallback to defaults
        currentPageSeo = pageDefaults[filename] ? { ...pageDefaults[filename] } : {};
        renderForm(currentPageSeo);
        document.getElementById('save-status').textContent = '⚠️ Kon niet laden van GitHub | defaults getoond';
    }
}

function extractSEO(html) {
    const seo = {};
    const getMeta = (name, attr='name') => {
        const regex = new RegExp(`<meta\\s+${attr}="${name}"\\s+content="([^"]*)"`, 'i');
        const m = html.match(regex);
        return m ? m[1] : '';
    };
    const getProp = (name) => getMeta(name, 'property');
    
    seo.title = (html.match(/<title>([^<]*)<\/title>/) || [])[1] || '';
    seo.description = getMeta('description');
    seo.canonical = (html.match(/<link rel="canonical" href="([^"]*)"/) || [])[1] || '';
    seo.ogTitle = getProp('og:title');
    seo.ogDescription = getProp('og:description');
    seo.ogImage = getProp('og:image');
    seo.twitterTitle = getMeta('twitter:title');
    seo.twitterDescription = getMeta('twitter:description');
    seo.twitterImage = getMeta('twitter:image');
    seo.robots = getMeta('robots');
    
    return seo;
}

function esc(s) { return (s || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function getFormData() {
    const g = id => document.getElementById(id)?.value || '';
    return {
        title: g('f-title'), description: g('f-description'),
        canonical: g('f-canonical'), robots: g('f-robots'),
        ogTitle: g('f-ogTitle'), ogDescription: g('f-ogDescription'), ogImage: g('f-ogImage'),
        twitterTitle: g('f-twitterTitle'), twitterDescription: g('f-twitterDescription'), twitterImage: g('f-twitterImage')
    };
}

function onFieldChange() {
    updateCharCounts();
    document.getElementById('save-status').textContent = '✏️ Gewijzigd';

function updateCharCounts() {
    const title = document.getElementById('f-title')?.value || '';
    const desc = document.getElementById('f-description')?.value || '';
    
    const countTitle = document.getElementById('count-title');
    const countDesc = document.getElementById('count-desc');
    
    if (countTitle) {
        countTitle.textContent = `${title.length} tekens`;
        countTitle.className = 'char-count' + (title.length > 60 ? ' danger' : title.length > 55 ? ' warn' : '');
    }
    if (countDesc) {
        countDesc.textContent = `${desc.length} tekens`;
        countDesc.className = 'char-count' + (desc.length > 160 ? ' danger' : desc.length > 155 ? ' warn' : '');
    }
}

// ─── Generate updated HTML head ───

    const canonical = seo.canonical || `https://lemnion.com/${currentFilename}`;
    return `    <meta charset="UTF-8">

    <meta property="og:type" content="website">

    <meta name="twitter:image" content="${seo.twitterImage || seo.ogImage || 'https://lemnion.com/assets/logo-og.png'}">`;
}

// ─── Deploy via GitHub API ───
async function deployPage() {
    if (!githubToken) { showToast('error', '⚠️ Stel eerst een GitHub token in'); return setupToken(); }
    if (!currentPageSeo) { showToast('error', '⚠️ Laad eerst een pagina'); return; }
    
    const seo = getFormData();
    const filename = currentFilename;
    document.getElementById('save-status').textContent = '⏳ Deployen...';
    
    try {
        // Get current file SHA
        const getUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${filename}?ref=${BRANCH}`;
        const getResp = await fetch(getUrl, {
            headers: { 'Authorization': `token ${githubToken}`, 'Accept': 'application/vnd.github.v3+json' }
        });
        if (!getResp.ok) throw new Error(`GitHub GET failed: ${getResp.status}`);
        const fileData = await getResp.json();
        const sha = fileData.sha;
        let html = atob(fileData.content);
        
        // Replace SEO head section
        const newHead = generateHeadHTML(seo);
        const oldHeadRegex = /<meta charset="UTF-8">[\s\S]*?<meta name="twitter:image"[^>]*>/;
        html = html.replace(oldHeadRegex, newHead);
        
        // Commit
        const putUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${filename}`;
        const body = {
            message: `SEO update: ${filename.replace('.html','')}`,
            content: btoa(unescape(encodeURIComponent(html))),
            sha: sha,
            branch: BRANCH
        };
        const putResp = await fetch(putUrl, {
            method: 'PUT',
            headers: { 'Authorization': `token ${githubToken}`, 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
        if (!putResp.ok) throw new Error(`GitHub PUT failed: ${putResp.status}`);
        
        document.getElementById('save-status').textContent = '✅ Gedeployed! (CDN ~30s)';
        showToast('success', `✅ ${filename} gedeployed! Live over ~30 seconden.`);
    } catch (e) {
        document.getElementById('save-status').textContent = '❌ Fout bij deploy';
        showToast('error', `❌ ${e.message}`);
    }
}

async function deployAll() {
    if (!githubToken) { showToast('error', '⚠️ Stel eerst een GitHub token in'); return setupToken(); }
    if (!confirm('Alle 7 pagina\'s deployen met huidige SEO-waarden? Dit overschrijft alle head-secties.')) return;
    
    document.getElementById('save-status').textContent = '⏳ Alle pagina\'s deployen...';
    const pages = Object.keys(pageDefaults);
    let done = 0, failed = 0;
    
    for (const filename of pages) {
        try {
            const seo = pageDefaults[filename];
            const getUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${filename}?ref=${BRANCH}`;
            const getResp = await fetch(getUrl, {
                headers: { 'Authorization': `token ${githubToken}`, 'Accept': 'application/vnd.github.v3+json' }
            });
            if (!getResp.ok) throw new Error(`GET ${filename}: ${getResp.status}`);
            const fileData = await getResp.json();
            const sha = fileData.sha;
            let html = atob(fileData.content);
            
            const newHead = generateHeadHTML(seo);
            const oldHeadRegex = /<meta charset="UTF-8">[\s\S]*?<meta name="twitter:image"[^>]*>/;
            html = html.replace(oldHeadRegex, newHead);
            
            const putUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${filename}`;
            const body = {
                message: `SEO update: ${filename.replace('.html','')}`,
                content: btoa(unescape(encodeURIComponent(html))),
                sha: sha,
                branch: BRANCH
            };
            const putResp = await fetch(putUrl, {
                method: 'PUT',
                headers: { 'Authorization': `token ${githubToken}`, 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            if (putResp.ok) done++; else failed++;
        } catch (e) { failed++; }
    }
    
    document.getElementById('save-status').textContent = `✅ ${done} gedeployed${failed ? `, ${failed} fout` : ''}`;
    showToast(failed ? 'error' : 'success', `${done} pagina's gedeployed${failed ? `, ${failed} mislukt` : ' ✅'}`);
}

// ─── Toast ───
function showToast(type, msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = `toast ${type}`;
    t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 4000);
}

// ─── Init ───
if (sessionStorage.getItem('hes_seo_authed') === '1') {
    document.getElementById('login-gate').style.display = 'none';
    document.getElementById('admin-panel').style.display = 'block';
    updateTokenStatus();
}

document.getElementById('login-password').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
});
