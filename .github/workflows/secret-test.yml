name: Secret Test
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test secret
        run: |
          echo "Secret lengte: ${#GH_ADMIN_TOKEN}"
          RESP=$(curl -s -H "Authorization: Bearer ${GH_ADMIN_TOKEN}" https://api.github.com/user)
          echo "Login: $(echo $RESP | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("login", d.get("message","?")))' 2>/dev/null)"
        env:
          GH_ADMIN_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}

