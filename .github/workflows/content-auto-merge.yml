name: Content Auto-Merge

# Pusht content-updates van de content-branch automatisch door naar main (→ live).
# Draait op elke push naar content en elke 30 minuten (vangt cronjob-pushes op
# die geen workflow triggeren door git-slimme pushes te missen).

on:
  push:
    branches: [content]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: content-auto-merge
  cancel-in-progress: true

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'jacobdegraaff'
    steps:
      - name: Checkout content
        uses: actions/checkout@v4
        with:
          ref: content
          fetch-depth: 0

      - name: Fetch main
        run: |
          git fetch origin main --depth=50

      # Alleen content-bestanden mogen automatisch door naar main
      - name: Controleer of alleen content is gewijzigd
        id: check
        run: |
          BASE=$(git merge-base origin/main HEAD)
          CHANGED=$(git diff --name-only "$BASE" HEAD)
          echo "Gewijzigde bestanden:"
          echo "$CHANGED"
          echo "changed<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGED" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          # Content-whitelist: alleen deze bestanden mogen door
          if [ -z "$CHANGED" ]; then
            echo "Geen wijzigingen ten opzichte van main — niets te doen."
            echo "content_only=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CONTENT_ONLY=true
          while IFS= read -r file; do
            case "$file" in
              nieuws.html|subsidies.html|sitemap.xml|robots.txt|CONTENT-RICHTLIJNEN.md) ;;
              HES_Budget_*.xlsx|assets/*|images/*|img/*|uploads/*|*.png|*.jpg|*.jpeg|*.webp|*.svg|*.gif|*.pdf) ;;
              *)
                echo "❌ Niet-content bestand gedetecteerd: $file"
                CONTENT_ONLY=false
                ;;
            esac
          done <<< "$CHANGED"

          if [ "$CONTENT_ONLY" = "true" ]; then
            echo "✅ Alleen content — merge naar main is toegestaan."
            echo "content_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️ Code/structuur gewijzigd — automatische merge GEBLOKKEERD. Gebruik dev-branch + PR."
            echo "content_only=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge content → main (met admin-token)
        if: steps.check.outputs.content_only == 'true'
        run: |
          git config user.name "jacobdegraaff"
          git config user.email "jacob@mjpeople.nl"
          # Maak lokaal een main-branch aan vanaf origin/main (actions/checkout
          # heeft alleen content uitgecheckt)
          git checkout -B main origin/main
          git merge --no-ff origin/content -m "Content-update: automatische merge van content-branch naar main"
          git push "https://x-access-token:${GH_ADMIN_TOKEN}@github.com/jacobdegraaff/hes-website.git" main
        env:
          GH_ADMIN_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}

      - name: Content Guard melding (geen auto-merge)
        if: steps.check.outputs.content_only == 'false'
        run: |
          echo "::error::Content-branch bevat niet-content wijzigingen. Automatische merge overgeslagen."
          echo "Gebruik de dev-branch + pull request voor code/structuur-wijzigingen."
          exit 1
