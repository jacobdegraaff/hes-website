<script>
/* Mobile menu: move nav-links outside nav stacking context */
(function(){
    var nav = document.querySelector('nav');
    var panel = document.getElementById('mobile-menu-panel');
    var links = document.querySelector('.nav-links');
    if (!panel || !links) return;
    
    function moveMenu() {
        if (window.innerWidth <= 1180) {
            if (links.parentNode !== panel) {
                panel.appendChild(links);
            }
        } else {
            var container = nav.querySelector('.container');
            if (links.parentNode === panel && container) {
                container.appendChild(links);
            }
        }
    }
    
    moveMenu();
    window.addEventListener('resize', moveMenu);
})();
</script>

<script>
/* Close menu when clicking a non-dropdown link */
document.querySelectorAll('.nav-links > li:not(.nav-dropdown) > a').forEach(function(l){
  l.addEventListener('click',function(){
    if(window.innerWidth<=1180){
      var m=document.querySelector('.mobile-menu-panel');
      var b=document.querySelector('.menu-toggle');
      if(m){m.classList.remove('active');m.style.display=''}
      if(b){b.classList.remove('active');b.setAttribute('aria-expanded','false')}
      var cm=document.getElementById('contact-modal');
      if(!cm||cm.style.display!=='flex'){lockScroll(false)}
    }
  })
});
/* Close menu on ESC */
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&window.innerWidth<=1180){
    var m=document.querySelector('.mobile-menu-panel');
    var b=document.querySelector('.menu-toggle');
    if(m&&m.classList.contains('active')){
      if(m.style.display)m.style.display='';
      m.classList.remove('active');
      if(b){b.classList.remove('active');b.setAttribute('aria-expanded','false')}
      var cm=document.getElementById('contact-modal');
      if(!cm||cm.style.display!=='flex'){lockScroll(false)}
    }
  }
});
</script>

    } : {
        vul: 'Vul je ', in: ' in.', email: 'Vul een geldig e-mailadres in.',
        sending: 'Versturen...', thanks: 'Bedankt voor je bericht!',
        soon: 'We nemen binnen 24 uur contact met je op.',
        fail: 'Het versturen is mislukt. Probeer het later opnieuw.',
        netfail: 'Het versturen is mislukt. Controleer je internetverbinding en probeer het opnieuw.'
    };

    function clearErrors() {
        form.querySelectorAll('[id^="error-"], #form-error').forEach(function(el){ el.remove(); });
        form.querySelectorAll('[aria-invalid]').forEach(function(el){ el.removeAttribute('aria-invalid'); });
    }

    function showErrors(errors) {
        var first = null;
        for (var key in errors) {
            var input = document.getElementById(key);
            if (!input) continue;
            input.setAttribute('aria-invalid', 'true');
            var err = document.createElement('p');
            err.id = 'error-' + key;
            err.style.cssText = 'color:var(--color-error,#C0392B);font-size:0.8rem;margin:0.25rem 0 0;';
            err.textContent = errors[key];
            input.parentNode.appendChild(err);
            if (!first) first = input;
        }
        if (first) first.focus();
    }

    function showFormError(msg) {
        var el = document.getElementById('form-error');
        if (!el) {
            el = document.createElement('p');
            el.id = 'form-error';
            el.setAttribute('role', 'alert');
            el.style.cssText = 'color:var(--color-error,#C0392B);font-size:0.9rem;margin:0 0 1rem;';
            form.insertBefore(el, form.firstChild);
        }
        el.textContent = msg;
    }

    form.addEventListener('submit', function(e) {
        e.preventDefault();
        clearErrors();

        var payload = {
            voornaam: document.getElementById('voornaam').value.trim(),
            achternaam: document.getElementById('achternaam').value.trim(),
            bedrijfsnaam: document.getElementById('bedrijfsnaam').value.trim(),
            functie: document.getElementById('functie').value.trim(),
            email: document.getElementById('email').value.trim(),
            mobiel: document.getElementById('mobiel').value.trim(),
            bericht: document.getElementById('bericht').value.trim(),
            website: honeypot.value,
            lang: LANG
        };

        // Client-side validatie (taalafhankelijk via <html lang>)
        var errors = {};
        for (var key in requiredLabels) {
            if (!payload[key]) errors[key] = T.vul + requiredLabels[key] + T.in;
        }
        if (payload.email && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(payload.email)) {
            errors.email = T.email;
        }
        if (Object.keys(errors).length > 0) {
            showErrors(errors);
            return;
        }

        var btn = form.querySelector('button[type="submit"]');
        var orig = btn ? btn.innerHTML : '';
        if (btn) { btn.disabled = true; btn.innerHTML = T.sending; }

        fetch('/api/contact', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        }).then(function(r){
            return r.json().then(function(d){ return { ok: r.ok, data: d }; });
        }).then(function(res){
            if (res.ok && res.data.success) {
                form.innerHTML = '<div style="text-align:center;padding:2rem;">' +
                    '<div style="font-size:3rem;margin-bottom:1rem;">✓</div>' +
                    '<h3 style="color:var(--green-primary);margin-bottom:0.5rem;">' + T.thanks + '</h3>' +
                    '<p style="color:var(--text-muted);">' + T.soon + '</p></div>';
                return;
            }
            if (btn) { btn.disabled = false; btn.innerHTML = orig; }
            if (res.data.errors) {
                showErrors(res.data.errors);
            } else {
                showFormError(res.data.message || T.fail);
            }
        }).catch(function(){
            if (btn) { btn.disabled = false; btn.innerHTML = orig; }
            showFormError(T.netfail);
        });
    });

    // Sluit modal met ESC
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            var modal = document.getElementById('contact-modal');
            if (modal && modal.style.display === 'flex') {
                modal.style.display = 'none';
                lockScroll(false)
            }
        }
    });
})();
</script>
